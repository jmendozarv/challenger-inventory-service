plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.16.0'
}

group = 'com.challenge'
version = '1.0.1-SNAPSHOT'
description = 'Inventory microservice for stock management'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

openApiGenerate {
    generatorName.set("spring")
    inputSpec.set("$projectDir/src/main/resources/openapi/inventory-api.yaml")
    outputDir.set("$buildDir/generated")

    apiPackage.set("com.challenge.inventory.api")
    modelPackage.set("com.challenge.inventory.model")
    invokerPackage.set("com.challenge.inventory.invoker")

    configOptions.set([
            useSpringBoot3        : "true",
            reactive              : "true",
            interfaceOnly         : "true",
            documentationProvider : "springdoc",
            dateLibrary           : "java8"
    ])
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.16'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.8'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'

    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('javadoc') {
    dependsOn tasks.named('openApiGenerate')
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    options.addStringOption('Xdoclint:none', '-quiet')
}
